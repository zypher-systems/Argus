# Publish backend and web images when a version tag is pushed.
# GitHub-hosted runners only: ubuntu-latest and ubuntu-24.04-arm.
# Each image is built on its own architecture, then combined into one tag.
# The packages are pushed with GITHUB_TOKEN. No extra registry secret.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag, such as v2.16.0
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            file: backend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: backend
            context: backend
            file: backend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: web
            context: frontend
            file: frontend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: web
            context: frontend
            file: frontend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Choose the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${INPUT_TAG}"
          fi
          case "${tag}" in
            v[0-9]*) ;;
            *) echo "refusing to publish tag ${tag}" >&2; exit 1 ;;
          esac
          platform="${{ matrix.platform }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/zypher-systems/argus
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=ghcr.io/zypher-systems/argus/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ steps.tag.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish tags
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Choose the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${INPUT_TAG}"
          fi
          case "${tag}" in
            v[0-9]*) ;;
            *) echo "refusing to publish tag ${tag}" >&2; exit 1 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tags
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          registry="ghcr.io/zypher-systems/argus"
          for image in backend web; do
            args=()
            for digest_file in "${RUNNER_TEMP}/digests/digests-${image}-"*/*; do
              args+=("${registry}/${image}@sha256:$(basename "${digest_file}")")
            done
            if [ "${#args[@]}" -ne 2 ]; then
              echo "expected amd64 and arm64 digests for ${image}, got ${#args[@]}" >&2
              printf '  %s\n' "${args[@]:-}" >&2
              exit 1
            fi
            docker buildx imagetools create \
              --tag "${registry}/${image}:${TAG}" \
              --tag "${registry}/${image}:latest" \
              "${args[@]}"
            docker buildx imagetools inspect "${registry}/${image}:${TAG}"
          done
